<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="5; url=http://portal.grandhotel-wifi.example/login?orig=http%3A%2F%2Fntfy.home.example%2F">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Grand Hotel Wi-Fi</title>
</head>
<body>
<h1>Welcome! Please sign in to access the internet</h1>
<form method="post" action="http://portal.grandhotel-wifi.example/login">
  <label>Room number: <input name="room" autocomplete="off"></label>
  <label>Last name: <input name="name"></label>
  <label><input type="checkbox" name="terms" value="1"> I accept the terms of use</label>
  <button type="submit">Connect</button>
</form>
<p>Need help? Dial 0 from your room phone.</p>
</body>
</html>
